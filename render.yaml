services:
  - type: web
    name: examplayer-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_USER_ID
        value: "747573651"
      - key: UPI_ID
        value: "examplayer@upi"
      - key: PREMIUM_PRICE
        value: "99"
